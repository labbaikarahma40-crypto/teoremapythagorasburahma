<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Jelajah Pythagoras</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fd;--card:#fff;--ink:#112640;--mut:#52667e;--blue:#1f5fd6;--teal:#0e9f9f;--yel:#f6c026;--ok:#17894a;--bad:#c63838;--line:#d3e0ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d192a;--card:#162840;--ink:#e8f0fb;--mut:#a0b3cb;--blue:#6ea0ff;--teal:#3cc7c7;--line:#2b4260;--ok:#4cc884;--bad:#ff7b7b}}
:root[data-theme=dark]{--bg:#0d192a;--card:#162840;--ink:#e8f0fb;--mut:#a0b3cb;--blue:#6ea0ff;--teal:#3cc7c7;--line:#2b4260;--ok:#4cc884;--bad:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif}
header{padding:14px 16px 4px;max-width:920px;margin:auto}header b{font-size:20px;color:var(--blue)}#sv{float:right;font-size:13px;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;max-width:920px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:920px;margin:auto;padding:4px 16px 60px}h1{font-size:28px;line-height:1.2;color:var(--blue)}h2{font-size:22px;margin:10px 0}h3{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.mut{color:var(--mut)}
.b{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;min-height:46px;margin:4px 6px 4px 0}.b.y{background:var(--yel);color:#2a2000}.b.g{background:transparent;color:var(--blue);border:2px solid var(--blue)}.b:disabled{opacity:.45;cursor:not-allowed}
:is(button,input,select,textarea):focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}input[type=range]{padding:0}
label{display:block;font-weight:700;margin:8px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.op{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}.op.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}.op.ok{border-color:var(--ok)}.op.no{border-color:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{padding:5px 12px;border-radius:14px;background:var(--line);font-size:14px}.steps .on{background:var(--teal);color:#fff;font-weight:800}.steps .dn{background:var(--blue);color:#fff}
.hint{background:#fff3c4;color:#3a2f00;border-left:6px solid var(--yel);padding:10px 12px;border-radius:8px;margin:8px 0}.fb{border-left:6px solid var(--ok);padding:10px 12px;background:color-mix(in srgb,var(--ok) 12%,var(--card));border-radius:8px;margin:8px 0}.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.formula{font-size:28px;font-weight:800;text-align:center;color:var(--blue)}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:15px}
.cards{display:flex;flex-wrap:wrap;gap:8px}.cd{border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;margin:0}
svg{max-width:360px;width:100%;display:block;margin:8px auto}svg text{font:700 13px Nunito,sans-serif;fill:var(--ink)}.lb{text-anchor:middle}.ls{text-anchor:start}.ar{text-anchor:middle;font-size:12px}
.tr{fill:var(--card);stroke:var(--ink);stroke-width:2}.ra{fill:none;stroke:var(--ink)}.s1{fill:var(--teal);opacity:.4}.s2{fill:var(--yel);opacity:.5}.s3{fill:var(--blue);opacity:.35}
.bar{background:var(--blue);height:22px;border-radius:6px;transition:width .4s}.row{margin-top:10px}.chip{display:inline-block;min-width:34px;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;margin:2px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit}.chip.on{border-color:var(--blue)}.chip.dn{background:var(--blue);color:#fff}
#tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;z-index:9;max-width:90%}
.exb{background:var(--bad);color:#fff;padding:10px 14px;border-radius:10px;font-weight:800}
</style></head><body>
<header><span id="sv">Belum ada data tersimpan</span><b>Jelajah Pythagoras</b></header><nav id="nv"></nav><main id="app"></main><div id="tt" role="status"></div>
<script>
const $=s=>document.querySelector(s),L='ABCD',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=(()=>{try{return JSON.parse(localStorage.getItem('pyth_s'))}catch(e){return null}})()||{};
S=Object.assign({sid:'',nama:'',kls:'',hd:'Hadir',abs:'',view:'home',m:{},g:null,gs:null,pr:null,ex:null,rf:['','','',''],set:{d:30,l:3},vid:'',vr:['','','','']},S);
let att=false,cf=false,tm=null,lastW=0,wb='',fsOn=false,clr=false;
const NAV=[['home','Absensi'],['m1','Misi 1'],['m2','Misi 2'],['m3','Misi 3'],['m4','Misi 4'],['m5','Misi 5'],['vid','Video'],['game','Games'],['lat','Latihan HOTS'],['exam','Ujian'],['hasil','Hasil'],['guru','Guru']];
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function save(){const c=$('#sv');try{localStorage.setItem('pyth_s',JSON.stringify(S));if(c)c.textContent='Tersimpan di perangkat ini';return true}catch(e){if(c)c.textContent='Gagal menyimpan';toast('Penyimpanan gagal: '+e.message+'. Jawaban hanya ada di layar ini.');return false}}
const recs=()=>{try{return JSON.parse(localStorage.getItem('pyth_r'))||[]}catch(e){return []}};
const nb=a=>a.filter((x,i)=>x===H[i].k).length,cat=n=>n>=90?'Sangat Baik':n>=80?'Baik':n>=70?'Cukup':'Perlu Belajar Lagi';
function saveRec(){if(!S.sid)return;const r=recs(),e=S.ex||{},a=e.a||[],f=!!e.en,b=nb(a);
 const o={sid:S.sid,nama:S.nama,kls:S.kls,abs:S.abs,hd:S.hd,mulai:e.st||'',j:Array.from({length:10},(_,i)=>a[i]==null?'':L[a[i]]),b:f?b:'',s:f?10-b:'',n:f?b*10:'',en:e.en||'',du:f?Math.round((new Date(e.en)-new Date(e.st))/1000):'',w:(e.w||[]).length,stt:e.stat||(e.st?'Berlangsung':'Belum ujian'),g:S.gs==null?'':S.gs};
 const i=r.findIndex(x=>x.sid==S.sid);i<0?r.push(o):r[i]=o;try{localStorage.setItem('pyth_r',JSON.stringify(r));return true}catch(x){toast('Rekap gagal disimpan: '+x.message);return false}}
/* ---------- gambar ---------- */
function tri(a,b,q,Lb,ar){const c=Math.hypot(a,b),W=320,H=q?300:230,k=q?Math.min(280/(a+2*b),260/(2*a+b)):Math.min(250/a,170/b),as=a*k,bs=b*k,x=q?(W-(a+2*b)*k)/2+b*k:35,y=q?(H-(2*a+b)*k)/2+(a+b)*k:H-30,f=n=>+n.toFixed(1),P=(...p)=>p.map(z=>f(z[0])+','+f(z[1])).join(' '),A=[x+as,y],B=[x,y-bs],n=[bs,-as],T=(X,Y,t,cl)=>`<text x="${f(X)}" y="${f(Y)}" class="${cl}">${t}</text>`;
 Lb=Lb||[a+' cm',b+' cm',+c.toFixed(2)+' cm'];let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Segitiga siku-siku dengan sisi ${Lb.join(', ')}">`;
 if(q){s+=`<polygon class=s1 points="${P([x,y],[x-bs,y],[x-bs,y-bs],B)}"/><polygon class=s2 points="${P([x,y],A,[A[0],y+as],[x,y+as])}"/><polygon class=s3 points="${P(A,B,[B[0]+n[0],B[1]+n[1]],[A[0]+n[0],A[1]+n[1]])}"/>`;
  if(ar)s+=T(x-bs/2,y-bs/2,b*b+' cm²','ar')+T(x+as/2,y+as/2,a*a+' cm²','ar')+T((A[0]+B[0])/2+n[0]/2,(A[1]+B[1])/2+n[1]/2,(a*a+b*b)+' cm²','ar')}
 s+=`<polygon class=tr points="${P([x,y],A,B)}" fill-opacity=".0"/><polyline class=ra points="${P([x+10,y],[x+10,y-10],[x,y-10])}"/>`+T(x+as/2,y-6,Lb[0],'lb')+T(x+6,y-bs/2,Lb[1],'ls');
 const d=Math.hypot(as,bs);return s+T((x+as/2)-as/d*18,(y-bs/2)+bs/d*18,Lb[2],'lb')+'</svg>'}
const gen=(a,b,c)=>`<svg viewBox="0 0 320 170" role="img" aria-label="Segitiga dengan sisi ${a}, ${b}, ${c}"><polygon class=tr points="30,150 290,150 200,30"/><text x="160" y="168" class=lb>${a}</text><text x="95" y="80" class=lb>${b}</text><text x="260" y="80" class=lb>${c}</text></svg>`;
/* ---------- data ---------- */
const H=[
{q:'Tangga sepanjang 10 meter diletakkan 6 meter dari dinding. Berapa tinggi yang dicapai?',o:['4 m','6 m','8 m','12 m'],k:2,e:'t² = 10² − 6² = 100 − 36 = 64, jadi t = 8 m.',t:'mencari sisi siku-siku'},
{q:'Tiang setinggi 12 meter memiliki kabel ke tanah yang berjarak 5 meter dari kaki tiang. Panjang kabel?',o:['11 m','12 m','13 m','17 m'],k:2,e:'k² = 12² + 5² = 169, jadi k = 13 m.',t:'mencari sisi miring'},
{q:'Taman berukuran 9 × 12 meter. Rute melalui dua sisi adalah 21 meter. Berapa jarak yang dihemat dengan mengambil diagonal?',o:['3 m','6 m','9 m','15 m'],k:1,e:'Diagonal = √(81 + 144) = 15 m. Hemat 21 − 15 = 6 m.',t:'diagonal dan perbandingan rute'},
{q:'Siswa menyatakan sisi 9, 12, dan 15 cm membentuk segitiga siku-siku. Penilaian yang benar?',o:['Benar, karena 9² + 12² = 15².','Salah, karena 9 + 12 tidak sama dengan 15.','Benar, karena ketiga sisinya berbeda.','Salah, karena 15 bukan sisi terpanjang.'],k:0,e:'81 + 144 = 225 = 15². Yang dibandingkan adalah kuadrat sisi, bukan jumlah sisi.',t:'tripel Pythagoras'},
{q:'Segitiga memiliki sisi 7, 8, dan 10 cm. Jenisnya?',o:['Lancip','Siku-siku','Tumpul','Sama sisi'],k:0,e:'7² + 8² = 113 > 10² = 100, jadi lancip.',t:'jenis segitiga'},
{q:'Segitiga siku-siku memiliki sisi miring 17 cm dan sisi siku-siku 8 cm. Panjang sisi lainnya?',o:['9 cm','12 cm','15 cm','25 cm'],k:2,e:'b² = 17² − 8² = 289 − 64 = 225, jadi b = 15 cm.',t:'mencari sisi siku-siku'},
{q:'Ramp memiliki tinggi 1,5 meter dan jarak mendatar 2 meter. Panjang ramp?',o:['2 m','2,5 m','3 m','3,5 m'],k:1,e:'p² = 1,5² + 2² = 2,25 + 4 = 6,25, jadi p = 2,5 m.',t:'soal cerita'},
{q:'Siswa menghitung sisi miring dari sisi 5 cm dan 12 cm dengan menjumlahkan langsung menjadi 17 cm. Kesalahannya?',o:['Seharusnya mengurangi panjang sisi.','Seharusnya menjumlahkan kuadrat kedua sisi lalu mengambil akar.','Seharusnya membagi kedua sisi.','Seharusnya menggunakan rumus keliling.'],k:1,e:'c = √(5² + 12²) = √169 = 13 cm, bukan 5 + 12.',t:'memahami rumus'},
{q:'Kelompok sisi yang membentuk segitiga tumpul?',o:['3, 4, 5','5, 5, 5','4, 5, 6','2, 3, 4'],k:3,e:'2² + 3² = 13 < 4² = 16 → tumpul. 3,4,5 siku-siku; 5,5,5 dan 4,5,6 lancip.',t:'jenis segitiga'},
{q:'Taman berukuran 15 × 20 meter memiliki jalur diagonal yang akan dipagari pada kedua sisinya. Total panjang pagar?',o:['25 m','40 m','45 m','50 m'],k:3,e:'Diagonal = √(225 + 400) = 25 m. Dipagari dua sisi: 2 × 25 = 50 m.',t:'soal cerita'}];
const GQ=[
{q:'Tangga 5 m dengan kaki tangga 3 m dari dinding. Tinggi yang dicapai?',p:()=>tri(3,4,false,['3 m','?','5 m']),o:['2 meter','3 meter','4 meter','5 meter'],k:2,e:'t² = 5² − 3² = 16, jadi t = 4 m.'},
{q:'Segitiga siku-siku dengan sisi 6 cm dan 8 cm. Sisi miringnya?',p:()=>tri(6,8,false,['6 cm','8 cm','?']),o:['10 cm','12 cm','14 cm','16 cm'],k:0,e:'c² = 36 + 64 = 100, jadi c = 10 cm.'},
{q:'Manakah tripel Pythagoras?',p:()=>'',o:['4, 5, 6','6, 8, 10','3, 5, 7','5, 6, 8'],k:1,e:'6² + 8² = 36 + 64 = 100 = 10².'},
{q:'Segitiga memiliki sisi 5 cm, 6 cm, dan 7 cm. Jenisnya?',p:()=>gen('6 cm','5 cm','7 cm'),o:['Lancip','Siku-siku','Tumpul','Sama sisi'],k:0,e:'5² + 6² = 61 > 7² = 49, jadi lancip.'},
{q:'Lapangan berukuran 12 m × 5 m. Panjang diagonalnya?',p:()=>tri(12,5,false,['12 m','5 m','?']),o:['10 meter','12 meter','13 meter','17 meter'],k:2,e:'d² = 144 + 25 = 169, jadi d = 13 m.'}];
const TR=[[3,4,5],[5,12,13],[6,8,10],[4,5,6],[7,24,25]];
const K=[{n:'Tangga',t:'Tangga 5 m disandarkan ke dinding. Kaki tangga berjarak 3 m dari dinding. Berapa tinggi yang dicapai?',a:3,b:4,Lb:['3 m','?','5 m'],f:1,ans:4,u:'m',sol:'Sisi miring 5 m dan alas 3 m. t² = 5² − 3² = 25 − 9 = 16, maka t = √16 = 4 m.'},
{n:'Lapangan',t:'Lapangan berukuran 12 m × 5 m. Berapa panjang diagonalnya?',a:12,b:5,Lb:['12 m','5 m','?'],f:0,ans:13,u:'m',sol:'d² = 12² + 5² = 144 + 25 = 169, maka d = 13 m.'},
{n:'Kabel tiang',t:'Tiang setinggi 12 m punya kabel ke tanah pada titik 5 m dari kaki tiang. Berapa panjang kabel?',a:5,b:12,Lb:['5 m','12 m','?'],f:0,ans:13,u:'m',sol:'k² = 12² + 5² = 144 + 25 = 169, maka k = 13 m.'},
{n:'Ramp',t:'Ramp memiliki tinggi 1,5 m dan jarak mendatar 2 m. Berapa panjang ramp?',a:2,b:1.5,Lb:['2 m','1,5 m','?'],f:0,ans:2.5,u:'m',sol:'p² = 2² + 1,5² = 4 + 2,25 = 6,25, maka p = 2,5 m.'}];
const FM=['c = √(a² + b²), untuk mencari sisi miring','b = √(c² − a²), untuk mencari sisi siku-siku','c = a + b'];
const HN=['Sisi manakah yang berhadapan dengan sudut siku-siku?','Tulis dulu kuadrat setiap sisi yang diketahui.','Ingat: setelah menjumlah atau mengurang kuadrat, ambil akar kuadratnya.'];
const cls=v=>{const [a,b,c]=v.slice().sort((x,y)=>x-y),s=a*a+b*b,t=c*c,e=Math.abs(s-t)<1e-9;return{a,b,c,s,t,valid:a>0&&a+b>c,j:e?'siku-siku':s>t?'lancip':'tumpul'}};
const rd=v=>+v.toFixed(2);
/* ---------- misi ---------- */
const MD={1:{t:'Misi 1: Mengamati dan Menemukan Konsep',obs:()=>tri(3,4,true,['3 cm','4 cm','5 cm'],false)+'<p>Ada persegi di setiap sisi segitiga siku-siku ini. Hitung luas tiap persegi (sisi × sisi). Persegi mana yang terbesar? Apa hubungan ketiga luas itu?</p>',pq:'Menurutmu, apa hubungan luas dua persegi kecil dengan persegi terbesar?',po:['Luas terbesar = jumlah dua luas kecil','Luas terbesar = hasil kali dua luas kecil','Tidak ada hubungan'],pk:0,lab:lab1,bq:'Segitiga 6, 8, 10: berapa jumlah kuadrat dua sisi yang lebih pendek?',bo:['36','64','100','196'],bk:2,hint:['Hitung 6 × 6 dan 8 × 8 dulu.','Jumlahkan 36 dan 64, lalu bandingkan dengan 10 × 10.'],ex:'36 + 64 = 100 = 10². Polanya sama seperti segitiga 3-4-5.',fin:'<p>Pada segitiga siku-siku, jumlah kuadrat panjang kedua sisi siku-siku sama dengan kuadrat sisi miring (sisi di depan sudut siku-siku).</p><p class=formula>a² + b² = c²</p>'},
2:{t:'Misi 2: Menemukan Rumus',obs:()=>tri(3,4,false,['3 cm','4 cm','?'])+'<p>Sisi miring segitiga ini belum diketahui. Bagaimana kamu mencarinya? Bagaimana jika yang dicari sisi siku-siku?</p>',pq:'Untuk sisi 3 dan 4: c² = 3² + 4² = 25. Berapa c?',po:['12,5','5','625'],pk:1,lab:lab2,bq:'Sisi miring 13 cm dan satu sisi siku-siku 5 cm. Mengapa sisi lainnya dicari dengan pengurangan?',bo:['Karena c² = a² + b², sehingga b² = c² − a²','Karena sisi siku-siku selalu lebih kecil dari 5','Karena rumusnya berubah menjadi a − b = c','Karena sisi miring harus dikurangi 2'],bk:0,hint:['Mulai dari a² + b² = c². Pindahkan a² ke ruas kanan.','Saat a² pindah ruas, tandanya berubah menjadi minus.'],ex:'b² = 13² − 5² = 169 − 25 = 144, jadi b = 12 cm.',fin:'<p>Tiga bentuk rumus yang kamu temukan:</p><p class=formula>c = √(a² + b²)<br>a = √(c² − b²)<br>b = √(c² − a²)</p><p><b>Tantangan:</b> coba sisi siku-siku 8 cm dan 15 cm pada simulasi, lalu jelaskan langkahmu di kesimpulan.</p>'},
3:{t:'Misi 3: Menemukan Tripel Pythagoras',obs:()=>'<div class=cards>'+TR.map(t=>`<span class=cd>${t.join(', ')}</span>`).join('')+'</div><p>Tiap kelompok adalah tiga bilangan bulat sebagai panjang sisi segitiga. Mana yang menurutmu membentuk segitiga siku-siku?</p>',pq:'Apa yang perlu kamu periksa untuk memutuskan?',po:['Apakah a² + b² = c², dengan c bilangan terbesar','Apakah a + b = c','Apakah ketiganya bilangan genap'],pk:0,lab:lab3,bq:'Mengapa 4, 5, 6 bukan tripel Pythagoras?',bo:['4² + 5² = 41, sedangkan 6² = 36','Karena 4 + 5 tidak sama dengan 6','Karena ada bilangan ganjil','Karena 6 terlalu kecil'],bk:0,hint:['Hitung 4² + 5² dan 6².','Apakah kedua hasil itu sama?'],ex:'41 ≠ 36, jadi tidak memenuhi a² + b² = c².',fin:'<p><b>Tripel Pythagoras</b> adalah tiga bilangan bulat positif a, b, c yang memenuhi a² + b² = c², dengan c bilangan terbesar.</p>'},
4:{t:'Misi 4: Mengklasifikasikan Segitiga',obs:()=>gen('6 cm','5 cm','7 cm')+'<p>Tiga segitiga: (5, 6, 7), (3, 4, 5), dan (2, 3, 4). Menurutmu apakah ketiganya sama-sama siku-siku?</p>',pq:'Segitiga dengan sisi 5, 6, 7 kira-kira berjenis...',po:['Lancip','Siku-siku','Tumpul'],pk:0,lab:lab4,bq:'Segitiga 2, 3, 4: bandingkan 2² + 3² dengan 4². Kesimpulannya?',bo:['13 < 16, tumpul','13 > 16, lancip','13 = 16, siku-siku','5 > 4, lancip'],bk:0,hint:['Hitung 2² + 3², lalu 4².','Jika jumlah kuadrat dua sisi pendek lebih kecil dari kuadrat sisi terpanjang, sudutnya terbuka lebar.'],ex:'13 < 16, sehingga segitiga tumpul.',fin:'<p>Urutkan sisi, ambil c terpanjang, lalu bandingkan:</p><ul><li>a² + b² = c²: siku-siku</li><li>a² + b² &gt; c²: lancip</li><li>a² + b² &lt; c²: tumpul</li></ul><p>Syarat segitiga: a + b &gt; c.</p>'},

 else{const x=Math.sqrt(m?p*p-q*q:p*p+q*q);h=m?`<p>b² = c² − a²<br>b² = ${p}² − ${q}² = ${rd(p*p)} − ${rd(q*q)} = ${rd(p*p-q*q)}<br>b = √${rd(p*p-q*q)} = <b>${rd(x)} cm</b></p><p class=mut>Dikurangi karena c² adalah jumlah a² dan b².</p>`:`<p>c² = a² + b²<br>c² = ${p}² + ${q}² = ${rd(p*p)} + ${rd(q*q)} = ${rd(p*p+q*q)}<br>c = √${rd(p*p+q*q)} = <b>${rd(x)} cm</b></p>`;

function hp(m,j){const e=S[m];if(m=='x'&&(!S.ex||S.ex.en))return;e.a[e.i]=j;save();if(m=='x')saveRec();render()}
const hg=(m,i)=>{S[m].i=i;cf=false;render()};
function rev(a,t){const b=nb(a);return `<h2>${t}</h2><div class=card><p class=formula>${b*10} / 100</p><p>Benar ${b}, salah ${10-b}.</p></div><h3>Pembahasan</h3>${H.map((q,i)=>`<div class=card><b>${i+1}. ${q.q}</b><p>Jawabanmu: ${a[i]==null?'(kosong)':L[a[i]]+'. '+q.o[a[i]]} ${a[i]===q.k?'✔':'✘'}<br>Kunci: ${L[q.k]}. ${q.o[q.k]}</p><div class="fb">${q.e}</div></div>`).join('')}`}
function vEx(){const e=S.ex;if(e&&e.st&&!e.en)return vQuiz('x');if(e&&e.en)return `<h2>Ujian sudah dikumpulkan</h2><div class=card><p>Status: ${esc(e.stat)}.</p><button class=b onclick="go('hasil')">Lihat hasil</button></div>`;
 return `<h2>Mode Ujian</h2><div class=card><p><b>${esc(S.nama)}</b>, kelas ${esc(S.kls)}</p><ul><li>10 soal pilihan ganda</li><li>Durasi ${S.set.d} menit (diatur guru)</li><li>Jawaban bisa ditinjau sebelum dikumpulkan</li><li>Pembahasan baru tampil setelah ujian berakhir</li><li>Jangan berpindah tab atau aplikasi. Perpindahan dicatat sebagai peringatan${S.set.l>0?'; ujian dihentikan pada peringatan ke-'+S.set.l:''}.</li></ul><p class=mut>Catatan: browser tidak dapat mengawasi sepenuhnya. Perpindahan tab bisa terjadi tanpa sengaja, jadi guru yang menilai hasil akhirnya.</p><button class="b y" onclick=xs()>MULAI UJIAN</button></div>`}
function xs(){if(!att||!S.sid){toast('Simpan absensi dulu.');return go('home')}S.ex={a:[],i:0,st:new Date().toISOString(),en:null,w:[],stat:'',dur:S.set.d,lim:S.set.l};save();saveRec();run();const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().catch(()=>toast('Fullscreen tidak tersedia. Ujian tetap berjalan.'));render()}
function run(){clearInterval(tm);tm=setInterval(tick,1000)}
function tick(){const e=S.ex;if(!e||!e.st||e.en){clearInterval(tm);return}const r=Math.max(0,e.dur*60-Math.floor((Date.now()-new Date(e.st))/1000)),t=$('#tm');if(t)t.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(r<=0)fin('Selesai','Waktu habis')}
function warn(r){const e=S.ex;if(!e||!e.st||e.en)return;const n=Date.now();if(n-lastW<1500)return;lastW=n;e.w.push({t:new Date().toISOString(),r});wb='Peringatan '+e.w.length+': '+r+'. Tetap fokus.';save();saveRec();if(e.lim>0&&e.w.length>=e.lim)fin('Dihentikan','Batas peringatan tercapai ('+e.lim+')');else{render();toast(wb)}}
function fin(st,why){const e=S.ex;if(!e||e.en)return;e.en=new Date().toISOString();e.stat=st;e.why=why||'';clearInterval(tm);cf=false;wb='';save();saveRec();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});S.view='hasil';render();toast(st=='Selesai'?'Ujian dikumpulkan.':'Ujian dihentikan: '+why)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)warn('Halaman ujian tidak terlihat (pindah tab atau aplikasi)')});
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)fsOn=true;else if(fsOn){fsOn=false;warn('Keluar dari mode fullscreen')}});
function vHasil(){const e=S.ex,f=e&&e.en,b=f?nb(e.a):0,n=b*10,done=[1,2,3,4,5].filter(i=>S.m[i]&&S.m[i].d).length,wr=f?H.filter((q,i)=>e.a[i]!==q.k).map(q=>q.t):[];
 return `<h2>Hasil Belajar</h2><div class=card><p><b>${esc(S.nama)||'(belum mengisi identitas)'}</b> ${esc(S.kls)}</p><p>Misi selesai: ${done} dari 5</p><div class=bar style="width:${done*20}%"></div><p>Skor game: ${S.gs==null?'belum main':S.gs+' / 100'}</p>${f?`<p>Nilai ujian: <b>${n}</b> (${cat(n)})<br>Benar ${b}, salah ${10-b}<br>Waktu pengerjaan: ${Math.round((new Date(e.en)-new Date(e.st))/1000)} detik<br>Peringatan tercatat: ${e.w.length}<br>Status: ${esc(e.stat)}${e.why?' ('+esc(e.why)+')':''}</p><div class=fb>${n>=90?'Hebat! Pertahankan, coba bantu temanmu.':n>=80?'Bagus. Ulangi soal yang salah.':n>=70?'Cukup. Ulangi Misi yang berkaitan.':'Ulangi Misi 1 sampai 5 pelan-pelan, lalu coba Latihan HOTS.'}${wr.length?' Perlu diperkuat: '+[...new Set(wr)].join(', ')+'.':''}</div>`:'<p>Ujian belum dikerjakan.</p>'}</div><div class=card><h3>Refleksi</h3>${['Konsep apa yang berhasil kamu temukan sendiri?','Bagian mana yang paling menantang?','Bagaimana kamu membuktikan rumus Pythagoras?','Di mana konsep ini dapat diterapkan dalam kehidupan sehari-hari?'].map((q,i)=>`<label>${q}<textarea rows=2 oninput="S.rf[${i}]=this.value;save()">${esc(S.rf[i])}</textarea></label>`).join('')}</div>${f?rev(e.a,'Pembahasan Ujian'):''}`}
const HD=['Nomor','Nama siswa','Kelas','Tanggal','Waktu mulai','Status kehadiran',...Array.from({length:10},(_,i)=>'Jawaban soal '+(i+1)),'Jumlah benar','Jumlah salah','Nilai akhir','Waktu selesai','Durasi pengerjaan (detik)','Jumlah peringatan ujian','Status penyelesaian ujian'];
const tm2=x=>x?new Date(x).toLocaleTimeString('id-ID'):'';
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return[HD,...recs().map((r,i)=>[i+1,r.nama,r.kls,r.abs?new Date(r.abs).toLocaleDateString('id-ID'):'',tm2(r.mulai||r.abs),r.hd,...r.j,r.b,r.s,r.n,tm2(r.en),r.du,r.w,r.stt])].map(r=>r.map(q).join(',')).join('\n')}
function vGuru(){const r=recs(),d=r.filter(x=>x.n!==''),ns=d.map(x=>x.n),bins=[['90–100',90,100],['80–89',80,89],['70–79',70,79],['0–69',0,69]];
 return `<h2>Rekap untuk Guru</h2><div class="card hint">Data tersimpan di browser perangkat ini saja dan belum terhubung ke Canva Sheets atau perangkat siswa lain. Halaman ini tidak dilindungi kata sandi. Gunakan perangkat guru yang tepercaya, lalu ekspor CSV untuk diimpor ke Canva Sheets.</div><div class=card><b>Pengaturan ujian</b><div class=g2><label>Durasi (menit)<input type=number min=1 value=${S.set.d} oninput="S.set.d=Math.max(1,+this.value||30);save()"></label><label>Hentikan pada peringatan ke- (0 = hanya catat)<input type=number min=0 value=${S.set.l} oninput="S.set.l=Math.max(0,+this.value||0);save()"></label></div></div><div class=card><p>Siswa: <b>${r.length}</b> | Hadir: <b>${r.filter(x=>x.hd=='Hadir').length}</b> | Selesai ujian: <b>${d.length}</b></p><p>Rata-rata: <b>${ns.length?rd(ns.reduce((a,b)=>a+b,0)/ns.length):'-'}</b> | Tertinggi: <b>${ns.length?Math.max(...ns):'-'}</b> | Terendah: <b>${ns.length?Math.min(...ns):'-'}</b></p>${bins.map(([l,a,b])=>{const c=ns.filter(x=>x>=a&&x<=b).length;return`<div>${l}: ${c}<div class=bar style="width:${ns.length?c/ns.length*100:0}%"></div></div>`}).join('')}</div><div class="card tw"><table><tr><th>Nama</th><th>Kelas</th><th>Hadir</th><th>Nilai</th><th>Benar</th><th>Peringatan</th><th>Status</th><th>Game</th></tr>${r.map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(x.kls)}</td><td>${x.hd}</td><td>${x.n}</td><td>${x.b}</td><td>${x.w}</td><td>${esc(x.stt)}</td><td>${x.g}</td></tr>`).join('')||'<tr><td colspan=8>Belum ada data.</td></tr>'}</table><p class=mut>Peringatan tab dicatat apa adanya; jangan menyimpulkan menyontek hanya dari angka ini.</p></div><div class=card><button class=b onclick=dl()>Unduh CSV</button><button class="b g" onclick=cp()>Salin CSV</button><button class="b g" onclick=cl()>${clr?'Klik lagi untuk menghapus semua':'Hapus semua rekap'}</button><textarea id=cv rows=5 readonly>${esc(csv())}</textarea></div>`}
async function dl(){try{const d=window.claude&&await claude.use('downloads');if(!d){toast('Unduhan tidak tersedia di sini. Gunakan Salin CSV.');return}await d.save({filename:'REKAP_PYTHAGORAS_KELAS8.csv',data:'\ufeff'+csv()});toast('CSV disimpan.')}catch(e){toast(e&&e.code=='declined'?'Unduhan dibatalkan.':'Unduhan gagal. Gunakan Salin CSV.')}}
async function cp(){const t=$('#cv');t.select();try{await navigator.clipboard.writeText(t.value);toast('CSV disalin.')}catch(e){document.execCommand('copy')?toast('CSV disalin.'):toast('Salin manual dari kotak teks.')}}
function cl(){if(!clr){clr=true;render();return}try{localStorage.removeItem('pyth_r')}catch(e){}clr=false;toast('Rekap dihapus.');render()}
/* ---------- kontrol ---------- */
function go(v){if(S.ex&&S.ex.st&&!S.ex.en)return;if(!att&&v!='home'&&v!='guru'){toast('Isi identitas dan simpan absensi dulu.');v='home'}S.view=v;cf=false;clr=false;save();render();scrollTo(0,0)}
function render(){const v=S.view,rn=S.ex&&S.ex.st&&!S.ex.en,F={home:vHome,vid:vVid,game:vGame,lat:()=>vQuiz('pr'),exam:vEx,hasil:vHasil,guru:vGuru};
 $('#nv').innerHTML=rn?'':NAV.map(([k,n])=>`<button class="${k==v?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 $('#app').innerHTML=rn?vEx():/^m\d$/.test(v)?vMod(+v[1]):F[v]();
 const s=S.m[+v[1]];if(!rn&&s&&s.s==2){({1:u1,2:u2})[+v[1]]&&({1:u1,2:u2})[+v[1]]();if(v=='m1')tb1()}if(rn)tick()}
if(!['home','guru'].includes(S.view)&&!(S.ex&&S.ex.st&&!S.ex.en))S.view='home';
if(S.ex&&S.ex.st&&!S.ex.en)run();render();
</script></body></html>
